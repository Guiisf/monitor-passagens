name: monitor-passagens

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 09:00 BRT, 1x por dia (cota SerpApi)
  workflow_dispatch:        # botão "Run workflow" pra rodar manualmente

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          SERP_KEY: ${{ secrets.SERP_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Commit dos dados e dashboard
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase
          git add -A
          git commit -m "coleta $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nada novo"
          git push
