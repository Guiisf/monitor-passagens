name: monitor-passagens

on:
  schedule:
    # SPRINT DE IDA ate 21/08/2026 13:34 UTC: de hora em hora, so ida (1 busca
    # por rota). Depois do prazo o monitor.py desliga o sprint sozinho e volta a
    # coletar 1x/dia -- e ai vale trocar este cron de volta para "0 12 * * *".
    - cron: "0 * * * *"
  workflow_dispatch:        # botão "Run workflow" pra rodar manualmente

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          SERP_KEY: ${{ secrets.SERP_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Commit dos dados e dashboard
        # always(): mesmo se o monitor quebrar, as buscas ja foram cobradas pela
        # SerpApi. Pular o commit perde o contador de cota e os precos coletados,
        # e o robo volta a achar que tem mais saldo do que tem. O job segue
        # marcado como falho pelo passo anterior.
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          # commit ANTES do pull: o monitor reescreve docs/index.html a cada
          # execucao, e `git pull --rebase` aborta com exit 128 se houver
          # alteracao nao commitada em arquivo rastreado
          git add -A
          if git diff --cached --quiet; then
            echo "nada novo para commitar"
            exit 0
          fi
          git commit -m "coleta $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
